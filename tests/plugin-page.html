<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plugin integration fixture</title><link rel="stylesheet" href="/plugin/Jellyfin.Plugin.Shorts/Web/dist/shorts.css"></head><body style="margin:0;background:#101316"><nav style="padding:12px;color:white">Jellyfin host fixture</nav><div id="plugin-root"></div><script src="/plugin/Jellyfin.Plugin.Shorts/Web/dist/shorts.js"></script><script>
// Synthetic same-origin host fixture; no real server, accounts or credentials.
const base = location.origin + '/tests/jellyfin/';
const originalFetch = window.fetch;
window.fetch = async function(input, init) {
  const url = String(input);
  if (!url.startsWith(base)) return originalFetch(input, init);
  if (url.includes('/Views')) return new Response(JSON.stringify({Items:[{Id:'library',Name:'Example collection'}]}));
  if (url.includes('/Items?')) return new Response(JSON.stringify({Items:[{Id:'example',Name:'Example movie',RunTimeTicks:72000000000}],TotalRecordCount:1}));
  if (url.includes('/PlaybackInfo')) return new Promise((resolve,reject)=>{init?.signal?.addEventListener('abort',()=>reject(new DOMException('Aborted','AbortError')),{once:true});});
  return new Response(null,{status:204});
};
window.ApiClient = {getUrl:path=>base+path,getCurrentUserId:()=> 'fixture-user',accessToken:()=> 'synthetic-token',deviceId:()=> 'fixture-device'};
location.hash = '#/userpluginsettings.html?pageUrl=/Shorts/Page';
window.JellyfinShorts.mountJellyfin(document.getElementById('plugin-root'),window.ApiClient);
</script></body></html>
