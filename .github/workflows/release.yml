name: Publish plugin release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: plugin-releases
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run check:privacy
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build:all
      - run: dotnet test tests/Jellyfin.Plugin.Shorts.Tests --configuration Release
      - name: Package the tagged version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package_plugin.py --expected-tag "$RELEASE_TAG"
      - name: Publish install archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/*.zip artifacts/*.sha256 artifacts/release-manifest.json --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/*.sha256 artifacts/release-manifest.json \
              --verify-tag --title "Shorts $RELEASE_TAG" --generate-notes --prerelease
          fi
      - name: Publish Jellyfin repository catalog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git checkout -B publish-catalog origin/main
          python3 scripts/package_plugin.py --merge artifacts/release-manifest.json
          python3 scripts/check_public_source.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Shorts catalog for $RELEASE_TAG"
            git push origin HEAD:main
          fi
