<div class="jellyfin-shorts-mount" aria-label="Jellyfin Shorts"><p role="status">Loading Shorts…</p></div>
<script>
(function () {
    'use strict';
    var container = document.currentScript.previousElementSibling;
    var api = window.ApiClient;
    function failed() { container.textContent = 'Unable to load Shorts. Refresh Jellyfin and try again.'; }
    if (!api) { failed(); return; }
    function mount() {
        if (!container.isConnected) return;
        try { window.JellyfinShorts.mountJellyfin(container, api); } catch (_) { failed(); }
    }
    if (!document.querySelector('link[data-jellyfin-shorts-style]')) {
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = api.getUrl('Shorts/Assets/shorts.css') + '?v=0.1.4.0';
        css.dataset.jellyfinShortsStyle = 'true';
        document.head.appendChild(css);
    }
    if (window.JellyfinShorts) { mount(); return; }
    var script = document.createElement('script');
    script.src = api.getUrl('Shorts/Assets/shorts.js') + '?v=0.1.4.0';
    script.onload = mount;
    script.onerror = failed;
    document.head.appendChild(script);
})();
</script>
